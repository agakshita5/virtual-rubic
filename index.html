<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Rubik's Cube</title>
  <style>
    body   { margin: 0; background: #15171c; overflow: hidden; }
    canvas { display: block; }
    #hint  { position: fixed; bottom: 18px; left: 18px; color: #6e7681;
             font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
             user-select: none; pointer-events: none; }
  </style>

  <!-- import map: lets `import ... from 'three'` resolve to the CDN build -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hint">drag to rotate</div>
  <script type="module" src="script.js"></script>
</body>
</html>
